name: 构建调试版 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle（工程里不带 wrapper jar，这里现取）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 debug 版
        run: |
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      # 失败时把报错原文推到 build-log 分支：Actions 的日志面板要登录才好翻，
      # 而那个分支里的文件谁都能直接读，省掉"截图—猜—再截图"这一轮。
      # 先抓 Kotlin 的报错行（e: file:///...kt:行号）：只贴 Gradle 堆栈等于没说清是哪个错。
      - name: 失败时回传报错原文
        if: failure()
        run: |
          { echo "commit $GITHUB_SHA"
            echo
            echo "--- kotlin errors ---"
            grep -E "^e: |: error:" /tmp/gradle.log | head -n 60 || true
            echo "--- what went wrong ---"
            grep -A 10 "What went wrong" /tmp/gradle.log || tail -n 40 /tmp/gradle.log
          } > build-error.txt
          git config user.name "build-log"
          git config user.email "build-log@localhost"
          git checkout -B build-log
          git add -f build-error.txt
          git commit -m "build failure log"
          git push -f origin build-log

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dayplan-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifacts 那个入口要登录 GitHub 才能下载，发给别人用等于卡住人家。
      # 顺手发成 Release，附件匿名可下，链接固定：
      #   https://github.com/StarXfmy/dayplan-widget/releases/latest/download/app-debug.apk
      - name: 发成 Release（不用登录就能下）
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          gh release create apk-latest \
            --title "Day Plan 桌面小组件（调试版）" \
            --notes "自用包，每次构建自动覆盖这个链接，装之前临时关掉小米的纯净模式。" \
            --latest "$APK" || {
              gh release edit apk-latest --title "Day Plan 桌面小组件（调试版）" --latest
              gh release upload apk-latest "$APK" --clobber
            }
